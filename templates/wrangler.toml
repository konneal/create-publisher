name = "{{ID}}-public"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Bindings are infrastructure facts, filled at bootstrap (see README).
# The engine reaches every one through its ports (ports/cloudflare);
# nothing in your code touches a binding type.
[vars]
INDEX_VERSION = "{{ID}}-v0.1"

[[vectorize]]
binding = "VECTORIZE"
index_name = "idx_{{ID}}_public"

[[kv_namespaces]]
binding = "CACHE"
id = "FILL_AT_BOOTSTRAP"

[[d1_databases]]
binding = "DB"
database_name = "{{ID}}-public"
database_id = "FILL_AT_BOOTSTRAP"

[ai]
binding = "AI"

# Sign-in through the estate identity service (optional — delete when
# the deployment serves anonymously). The engine ships the whole RP:
# PKCE sign-in, the session cookie, and renewal through the OP's
# refresh grant (offline_access — sessions re-judge live standing, so
# deactivation ends access at the next page load).
# OIDC_ISSUER = "https://id.oimlsmart.org"
# OIDC_CLIENT_ID = "<your registered client id>"
# OIDC_REDIRECT_URI = "https://<your host>/auth/callback"

[assets]
directory = "../../site/dist"
